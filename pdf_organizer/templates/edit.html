{% extends "base.html" %}
{% block title %}Edit {{ doc.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit Metadata</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" value="{{ doc.title }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" value="{{ doc.subject or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Batch</label>
                            <input type="text" name="batch" class="form-control" value="{{ doc.batch or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Class / Lecture</label>
                            <input type="text" name="class_name" class="form-control" value="{{ doc.class_name or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Class Date</label>
                            <input type="date" name="class_date" class="form-control" value="{{ doc.class_date.isoformat() if doc.class_date else '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Students</label>
                        <textarea name="students" class="form-control" rows="2">{{ doc.students or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ doc.description or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tags</label>
                        <input type="text" name="tags" class="form-control" value="{{ doc.tags or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            {% for c in ['PDF', 'Notes', 'Slides', 'Assignment', 'Other'] %}
                                <option value="{{ c }}" {% if doc.category == c %}selected{% endif %}>{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="2">{{ doc.notes or '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('detail', doc_id=doc.id) }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
