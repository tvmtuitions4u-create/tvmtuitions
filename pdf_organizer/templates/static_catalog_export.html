<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Catalog — Static Export</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8f9fa; }
        .doc-card { transition: all .15s; }
        .doc-card.hidden { display: none; }
        .navbar { background: #1a1a2e; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand"><i class="bi bi-folder2-open"></i> PDF Catalog (Static)</span>
            <span class="text-white-50 small">Generated {{ documents|length }} documents</span>
        </div>
    </nav>

    <div class="container">
        <div class="mb-4">
            <input type="text" id="search" class="form-control form-control-lg" placeholder="Search title, subject, batch, class, tags...">
        </div>

        <div class="row" id="results"></div>
    </div>

    <script>
    const DOCUMENTS = {{ json_data | tojson }};

    function render() {
        const term = document.getElementById('search').value.toLowerCase();
        const container = document.getElementById('results');
        container.innerHTML = '';

        const filtered = DOCUMENTS.filter(d => {
            if (!term) return true;
            const text = [d.title, d.subject, d.batch, d.class_name, d.tags, d.description, d.notes, d.students]
                .join(' ').toLowerCase();
            return text.includes(term);
        });

        if (filtered.length === 0) {
            container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No matching documents</div>';
            return;
        }

        filtered.forEach(d => {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4 mb-4';
            col.innerHTML = `
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">${escapeHtml(d.title)}</h5>
                        <div class="mb-2">
                            ${d.subject ? `<span class="badge bg-primary">${escapeHtml(d.subject)}</span>` : ''}
                            ${d.batch ? `<span class="badge bg-success">${escapeHtml(d.batch)}</span>` : ''}
                            <span class="badge bg-secondary">${escapeHtml(d.category)}</span>
                        </div>
                        ${d.class_name ? `<p class="small mb-1"><strong>${escapeHtml(d.class_name)}</strong></p>` : ''}
                        ${d.class_date ? `<p class="small text-muted">${d.class_date}</p>` : ''}
                        <p class="small text-muted">${escapeHtml((d.description || '').substring(0, 120))}</p>
                        ${d.tags ? `<div class="mt-2">${d.tags.split(',').map(t => `<span class="badge bg-light text-dark me-1">${escapeHtml(t.trim())}</span>`).join('')}</div>` : ''}
                    </div>
                    <div class="card-footer bg-white">
                        <small class="text-muted">${d.original_filename}</small>
                    </div>
                </div>`;
            container.appendChild(col);
        });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    document.getElementById('search').addEventListener('input', render);
    render();
    </script>
</body>
</html>
