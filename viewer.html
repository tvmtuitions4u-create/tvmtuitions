<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View PDF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {{ margin: 0; background: #212529; }}
    iframe {{ width: 100%; height: calc(100vh - 56px); border: none; background: white; }}
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">&larr; Back</a>
      <span class="navbar-text text-white" id="title">PDF Viewer</span>
      <a id="download" class="btn btn-sm btn-outline-light" href="#">Download</a>
    </div>
  </nav>
  <iframe id="viewer" src=""></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");
    const title = document.getElementById("title");
    const iframe = document.getElementById("viewer");
    const download = document.getElementById("download");

    if (file) {{
      const decoded = decodeURIComponent(file);
      title.textContent = decoded.split("/").pop();
      iframe.src = decoded;
      download.href = decoded;
    }} else {{
      title.textContent = "No PDF selected";
      iframe.style.display = "none";
    }}
  </script>
</body>
</html>
